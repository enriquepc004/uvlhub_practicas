name: Deploy to Render

on:
  workflow_run:
    workflows: ["Codacy CI"]
    types:
      -completed



# Variante para el ejercicio 3:
# desplegar solo cuando se cree un tag
#on:
   # push:
     # tags:
    #    - '*'
   # pull_request:
  #    branches:
 #       - main
#
jobs:

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to Render
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
